<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>DEBUG Flight</title>

<style>
body { margin:0; overflow:hidden; background:black; }
#hud {
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    background:rgba(0,0,0,0.7);
    padding:10px;
    max-width:90%;
    z-index:10;
}
</style>
</head>
<body>

<div id="hud">Start...</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>

<script>
let scene, camera, renderer, model;
const hud = document.getElementById("hud");

function log(msg){
    console.log(msg);
    hud.innerHTML = msg;
}

try {

scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0,5,10);

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Licht
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 1);
dir.position.set(10,20,10);
scene.add(dir);

// Boden
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(2000,2000),
    new THREE.MeshLambertMaterial({color:0x00aa00})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

log("Lade GLB...");

// GLB
const loader = new THREE.GLTFLoader();

loader.load(
    "./1.glb",
    (gltf) => {
        model = gltf.scene;
        scene.add(model);
        log("✔ GLB geladen!");
    },
    (xhr) => {
        log("Lade: " + Math.round(xhr.loaded/xhr.total*100) + "%");
    },
    (err) => {
        console.error(err);
        log("❌ GLB FEHLER: Datei nicht gefunden oder kaputt");
    }
);

animate();

function animate(){
    requestAnimationFrame(animate);

    if(model){
        model.rotation.y += 0.01;
    }

    renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

} catch(e){
    log("❌ JS ERROR: " + e.message);
}

</script>

</body>
</html>
