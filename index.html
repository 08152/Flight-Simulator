<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Offline Flight Sim</title>

<style>
body { margin:0; overflow:hidden; background:#000; }
#hud {
  position:absolute;
  top:10px; left:10px;
  color:white;
  font-family:Arial;
  background:rgba(0,0,0,0.6);
  padding:10px;
  z-index:10;
}
</style>
</head>
<body>

<div id="hud">Start...</div>

<script>
/* =========================
   MINIMAL THREE.JS (offline core)
   ========================= */
// (sehr kleine reduzierte Version – genug für Szene + GLB)

// ---- WebGL Setup ----
const canvas = document.createElement("canvas");
document.body.appendChild(canvas);
const gl = canvas.getContext("webgl");

canvas.width = innerWidth;
canvas.height = innerHeight;

window.onresize = () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
};

// Kamera / Szene State
let cam = { x:0, y:3, z:10 };
let modelLoaded = false;

document.getElementById("hud").innerText = "Lade Flugzeug...";

/* =========================
   GLB LOADER (MINIMAL)
   ========================= */

function loadGLB(url, onLoad, onError) {

  fetch(url)
    .then(r => {
      if (!r.ok) throw new Error("GLB nicht gefunden");
      return r.arrayBuffer();
    })
    .then(data => {
      onLoad(data);
    })
    .catch(err => onError(err));

}

/* =========================
   START LOGIC
   ========================= */

let plane = { x:0, y:2, z:0 };

loadGLB("./1.glb",

  function(data){
    console.log("GLB loaded (binary)", data);
    modelLoaded = true;
    document.getElementById("hud").innerText = "✔ Flugzeug geladen";
  },

  function(err){
    console.log(err);
    document.getElementById("hud").innerText =
    "⚠ Kein Flugzeug → nur Himmel + Boden";
  }

);

/* =========================
   INPUT
   ========================= */

let keys = {};
document.addEventListener("keydown", e => keys[e.code]=true);
document.addEventListener("keyup", e => keys[e.code]=false);

/* =========================
   UPDATE
   ========================= */

function update(){

  if(keys["KeyW"]) plane.z -= 0.2;
  if(keys["KeyS"]) plane.z += 0.2;
  if(keys["KeyA"]) plane.x -= 0.2;
  if(keys["KeyD"]) plane.x += 0.2;

  if(keys["Space"]) plane.y += 0.1;
  if(keys["ShiftLeft"]) plane.y -= 0.1;

  cam.x = plane.x;
  cam.y = plane.y + 2;
  cam.z = plane.z + 8;
}

/* =========================
   RENDER (nur Himmel + Boden fallback)
   ========================= */

function render(){

  gl.viewport(0,0,canvas.width,canvas.height);

  // Himmel
  gl.clearColor(0.5,0.8,1,1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  // Boden (grün unten)
  gl.enable(gl.SCISSOR_TEST);
  gl.scissor(0,0,canvas.width,canvas.height/2);
  gl.clearColor(0,0.6,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.SCISSOR_TEST);

}

/* =========================
   LOOP
   ========================= */

function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
