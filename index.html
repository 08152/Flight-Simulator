<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Flight Simulator</title>
<style>
body { margin: 0; overflow: hidden; }
canvas { display: block; }
#info {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  font-family: Arial;
  background: rgba(0,0,0,0.5);
  padding: 10px;
}
</style>
</head>
<body>

<div id="info">
WASD = Bewegung | Maus = Kamera | SPACE = hoch | SHIFT = runter
</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>

<script>
let scene, camera, renderer, model;
let velocity = 0;
let direction = new THREE.Vector3();

init();
animate();

function init() {

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 8);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Licht
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);

    // GRÜNER BODEN
    const groundGeo = new THREE.PlaneGeometry(500, 500);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x00aa00 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // GLB MODELL LADEN
    const loader = new THREE.GLTFLoader();
    loader.load('1.glb', function(gltf) {
        model = gltf.scene;
        model.scale.set(1,1,1);
        scene.add(model);
    });

    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);
    document.addEventListener('mousemove', onMouseMove);
}

let keys = {};

function onKeyDown(e){ keys[e.code] = true; }
function onKeyUp(e){ keys[e.code] = false; }

let mouseX = 0;
let mouseY = 0;

function onMouseMove(e){
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
}

function animate(){
    requestAnimationFrame(animate);

    if(model){

        // Bewegung
        if(keys["KeyW"]) model.translateZ(-0.2);
        if(keys["KeyS"]) model.translateZ(0.2);
        if(keys["KeyA"]) model.rotation.y += 0.02;
        if(keys["KeyD"]) model.rotation.y -= 0.02;

        if(keys["Space"]) model.position.y += 0.1;
        if(keys["ShiftLeft"]) model.position.y -= 0.1;

        // Kamera folgt
        camera.position.lerp(
            new THREE.Vector3(
                model.position.x,
                model.position.y + 3,
                model.position.z + 8
            ), 0.05
        );

        camera.lookAt(model.position);
    }

    renderer.render(scene, camera);
}

window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
