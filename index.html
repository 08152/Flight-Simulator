<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3D Flight Sim - Complete Version</title>
<style>
  body { margin: 0; overflow: hidden; background: #53b4ff; font-family: Arial, sans-serif; }
  #hud {
    position: absolute; top: 10px; left: 10px;
    color: white; background: rgba(0,0,0,0.8);
    padding: 15px; z-index: 10; border-radius: 5px;
    pointer-events: none; min-width: 260px;
  }
  .status-line { margin: 4px 0; font-size: 13px; font-weight: bold; }
  .loading { color: #ffcc00; }
  .success { color: #00ff00; }
  .error { color: #ff3333; }
</style>

<!-- Direkte Skript-Ladung ohne fehleranfällige Import-Maps -->
<script src="https://cloudflare.com"></script>
<script src="https://jsdelivr.net"></script>
</head>
<body>

<div id="hud">
  <strong>Steuerung:</strong> W/S (Nase) | A/D (Rollen) | Leertaste (Gas)<br>
  <hr style="border:0; border-top:1px solid rgba(255,255,255,0.3); margin:5px 0;">
  
  <div class="status-line">Flugzeug (1.glb): <span id="statusPlane" class="loading">Lade...</span></div>
  <div class="status-line">Stadt (golden_city.glb): <span id="statusMap" class="loading">Lade...</span></div>
  
  <hr style="border:0; border-top:1px solid rgba(255,255,255,0.3); margin:5px 0;">
  <strong>Flugzeug-Position:</strong><br>
  X: <span id="posX">0.0</span> | Y: <span id="posY">0.0</span> | Z: <span id="posZ">0.0</span>
</div>

<script>
// ========================================================
// MANUELLE KAMERA-JUSTIERUNG (Aus Vogelperspektive)
// ========================================================
const CAM_HOEHE   = 35;   // Höhe der Kamera über dem Flugzeug
const CAM_ABSTAND = -45;  // Abstand hinter dem Flugzeug

// Szene Setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x53b4ff); 
scene.fog = new THREE.FogExp2(0x53b4ff, 0.0005); 

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 50000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Flutlicht-Beleuchtung (Verhindert komplett schwarze Objekte)
const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
sunLight.position.set(1000, 2000, 1000);
scene.add(sunLight);

const loader = new THREE.GLTFLoader();

// ========================================================
// 2. MAP LOADER (golden_city.glb)
// ========================================================
let customMap = null;
const statusMapEl = document.getElementById("statusMap");

loader.load(
  './golden_city.glb', 
  function (gltf) {
    customMap = gltf.scene;
    
    // Automatische Größenberechnung der Stadt
    const box = new THREE.Box3().setFromObject(customMap);
    const size = box.getSize(new THREE.Vector3());
    
    // Falls die Stadt winzig exportiert wurde, blasen wir sie stark auf
    if (size.length() < 10) {
      customMap.scale.set(500, 500, 500);
    } else if (size.length() > 10000) {
      customMap.scale.set(0.1, 0.1, 0.1);
    } else {
      customMap.scale.set(1, 1, 1);
    }
    
    customMap.position.set(0, 0, 0); 

    // Rendere Texturen doppelseitig gegen Unsichtbarkeit
    customMap.traverse(function(child) {
      if (child.isMesh) {
        child.material.side = THREE.DoubleSide;
        child.material.depthWrite = true;
      }
    });

    scene.add(customMap);
    statusMapEl.innerText = "✔ Geladen!";
    statusMapEl.className = "success";
  },
  function (xhr) {
    if (xhr.total > 0) statusMapEl.innerText = "Lade: " + Math.round((xhr.loaded / xhr.total) * 100) + "%";
  },
  function (error) {
    console.error(error);
    statusMapEl.innerText = "⚠ Nicht im Ordner!";
    statusMapEl.className = "error";
  }
);

// ========================================================
// 3. FLUGZEUG LOADER (1.glb)
// ========================================================
let plane = null;
const statusPlaneEl = document.getElementById("statusPlane");

loader.load(
  './1.glb',
  function (gltf) {
    plane = gltf.scene;
    
    // Zwinge das Flugzeug vollautomatisch auf eine spielbare Standardgröße
    const box = new THREE.Box3().setFromObject(plane);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const targetScale = 6 / maxDim;
    plane.scale.set(targetScale, targetScale, targetScale);
    
    plane.position.set(0, 150, 0); // Startet hoch in der Luft

    // Fix gegen dezentrierte Drehpunkte (Modell-Zentrierung)
    const center = box.getCenter(new THREE.Vector3());
    plane.children.forEach(function(child) {
      child.position.x -= center.x;
      child.position.y -= center.y;
      child.position.z -= center.z;
    });

    // Erzwungene Sichtbarkeit der Flugzeughülle
    plane.traverse(function(child) {
      if (child.isMesh) {
        child.material.side = THREE.DoubleSide;
      }
    });

    scene.add(plane);
    statusPlaneEl.innerText = "✔ Geladen!";
    statusPlaneEl.className = "success";
  },
  function (xhr) {
    if (xhr.total > 0) statusPlaneEl.innerText = "Lade: " + Math.round((xhr.loaded / xhr.total) * 100) + "%";
  },
  function (error) {
    console.error(error);
    statusPlaneEl.innerText = "⚠ Nicht im Ordner!";
    statusPlaneEl.className = "error";
  }
);

// ========================================================
// 4. STEUERUNG & FLUGMECHANIK
// ========================================================
const keys = {};
document.addEventListener("keydown", function(e) { keys[e.code] = true; });
document.addEventListener("keyup", function(e) { keys[e.code] = false; });

let speed = 1.2; 

const elX = document.getElementById("posX");
const elY = document.getElementById("posY");
const elZ = document.getElementById("posZ");

function animate() {
  requestAnimationFrame(animate);

  if (plane) {
    plane.translateZ(speed);

    // Eingaben steuern Flugzeugachsen
    if (keys["KeyW"]) plane.rotation.x -= 0.015; // Runter neigen
    if (keys["KeyS"]) plane.rotation.x += 0.015; // Hoch neigen
    if (keys["KeyA"]) plane.rotation.z += 0.025; // Links rollen
    if (keys["KeyD"]) plane.rotation.z -= 0.025; // Rechts rollen
    
    if (keys["Space"]) {
      speed = Math.min(speed + 0.02, 5.0); // Beschleunigen
    } else {
      speed = Math.max(speed - 0.01, 0.5); // Bremsen
    }

    // Automatische Kurveneinleitung beim Rollen
    plane.rotation.y -= plane.rotation.z * 0.04;

    // Kamera folgt starr in voreingestellter Vogelperspektive
    const relativeCameraOffset = new THREE.Vector3(0, CAM_HOEHE, CAM_ABSTAND);
    const cameraOffset = relativeCameraOffset.applyMatrix4(plane.matrixWorld);
    
    camera.position.copy(cameraOffset);
    camera.lookAt(plane.position);

    // Live-Koordinaten ins HUD einspeisen
    elX.innerText = plane.position.x.toFixed(1);
    elY.innerText = plane.position.y.toFixed(1);
    elZ.innerText = plane.position.z.toFixed(1);
  }

  renderer.render(scene, camera);
}

// Responsive Anpassung bei Bildschirmänderung
window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>

</body>
</html>
