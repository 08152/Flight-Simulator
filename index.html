<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3D Flight Sim - Absolut Sicher</title>
<style>
  body { margin: 0; overflow: hidden; background: #53b4ff; font-family: Arial, sans-serif; }
  #hud {
    position: absolute; top: 10px; left: 10px;
    color: white; background: rgba(0,0,0,0.8);
    padding: 15px; z-index: 10; border-radius: 5px;
    pointer-events: none; min-width: 280px;
  }
  .status-line { margin: 4px 0; font-size: 13px; font-weight: bold; }
  .loading { color: #ffcc00; }
  .success { color: #00ff00; }
  .error { color: #ff3333; }
</style>

<!-- Extrem stabile, direkte CDN-Skripte (Verhindern White/Black-Screens komplett) -->
<script src="https://cloudflare.com"></script>
<script src="https://jsdelivr.net"></script>
</head>
<body>

<div id="hud">
  <strong>Steuerung:</strong> W/S (Nase) | A/D (Rollen) | Leertaste (Gas)<br>
  <hr style="border:0; border-top:1px solid rgba(255,255,255,0.3); margin:5px 0;">
  
  <!-- Das HUD zeigt dir live den Lade-Status auf GitHub an -->
  <div class="status-line">Flugzeug (1.glb): <span id="statusPlane" class="loading">Suche Datei...</span></div>
  <div class="status-line">Stadt (golden_city.glb): <span id="statusMap" class="loading">Suche Datei...</span></div>
  
  <hr style="border:0; border-top:1px solid rgba(255,255,255,0.3); margin:5px 0;">
  <strong>Flugzeug-Position:</strong><br>
  X: <span id="posX">0.0</span> | Y: <span id="posY">0.0</span> | Z: <span id="posZ">0.0</span>
</div>

<script>
// Kamera-Abstand von weit oben (Vogelperspektive)
const CAM_HOEHE   = 35;   
const CAM_ABSTAND = -45;  

// 1. ENGINE SETUP
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x53b4ff); // Sofort erzwungener blauer Himmel
scene.fog = new THREE.FogExp2(0x53b4ff, 0.0005); 

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 50000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Flutlicht-Beleuchtung (Verhindert schwarze Texturen)
const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
scene.add(ambientLight);
const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
sunLight.position.set(1000, 2000, 1000);
scene.add(sunLight);

// Korrekte Initialisierung für diese Three.js Version
const loader = new THREE.GLTFLoader();

let plane = null;
let customMap = null;
let planeLoaded = false;
let mapLoaded = false;

// Weblink-Korrektur für GitHub Pages
const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);

// ========================================================
// 2. GOLDEN CITY LOADER (golden_city.glb)
// ========================================================
const statusMapEl = document.getElementById("statusMap");

loader.load(
  baseUrl + 'golden_city.glb', 
  function (gltf) {
    mapLoaded = true;
    customMap = gltf.scene;
    
    // Automatische Skalierungskorrektur der Stadt
    const box = new THREE.Box3().setFromObject(customMap);
    const size = box.getSize(new THREE.Vector3());
    if (size.length() < 10) customMap.scale.set(500, 500, 500);
    else customMap.scale.set(1, 1, 1);
    
    customMap.position.set(0, 0, 0); 
    customMap.traverse(function(child) {
      if (child.isMesh) {
        child.material.side = THREE.DoubleSide;
        child.material.depthWrite = true;
      }
    });
    scene.add(customMap);
    statusMapEl.innerText = "✔ Erfolgreich geladen!";
    statusMapEl.className = "success";
  },
  function (xhr) {
    if (xhr.total > 0) statusMapEl.innerText = "Lade: " + Math.round((xhr.loaded / xhr.total) * 100) + "%";
  },
  function (error) {
    triggerMapFallback();
  }
);

// ========================================================
// 3. FLUGZEUG LOADER (1.glb)
// ========================================================
const statusPlaneEl = document.getElementById("statusPlane");

loader.load(
  baseUrl + '1.glb',
  function (gltf) {
    planeLoaded = true;
    plane = gltf.scene;
    
    // Automatische Skalierungskorrektur des Flugzeugs
    const box = new THREE.Box3().setFromObject(plane);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const targetScale = 6 / maxDim;
    plane.scale.set(targetScale, targetScale, targetScale);
    
    plane.position.set(0, 150, 0); 

    const center = box.getCenter(new THREE.Vector3());
    plane.children.forEach(function(child) {
      child.position.x -= center.x;
      child.position.y -= center.y;
      child.position.z -= center.z;
    });

    plane.traverse(function(child) {
      if (child.isMesh) child.material.side = THREE.DoubleSide;
    });

    scene.add(plane);
    statusPlaneEl.innerText = "✔ Erfolgreich geladen!";
    statusPlaneEl.className = "success";
  },
  function (xhr) {
    if (xhr.total > 0) statusPlaneEl.innerText = "Lade: " + Math.round((xhr.loaded / xhr.total) * 100) + "%";
  },
  function (error) {
    triggerPlaneFallback();
  }
);

// ========================================================
// 4. AUTOMATISCHER FALLBACK (Greift nach 1 Sekunde bei Blockade)
// ========================================================
setTimeout(function() {
  if (!mapLoaded) triggerMapFallback();
  if (!planeLoaded) triggerPlaneFallback();
}, 1000);

function triggerMapFallback() {
  if (customMap || mapLoaded) return;
  mapLoaded = true;
  
  // Grüner Notfall-Boden
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(10000, 10000), new THREE.MeshStandardMaterial({color: 0x2e8b57}));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  
  // Generierte 3D-Häuserblocks
  for (let i = 0; i < 50; i++) {
    const h = Math.random() * 60 + 15;
    const box = new THREE.Mesh(new THREE.BoxGeometry(20, h, 20), new THREE.MeshStandardMaterial({color: 0xdaa520}));
    box.position.set((Math.random() - 0.5) * 800, h / 2, (Math.random() - 0.5) * 800);
    scene.add(box);
  }
  
  statusMapEl.innerText = "⚠ Blockiert! (Nutze Notfall-Stadt)";
  statusMapEl.className = "error";
}

function triggerPlaneFallback() {
  if (plane || planeLoaded) return;
  planeLoaded = true;
  
  // Notfall-Flugzeug aus Code bauen
  plane = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(1, 5, 8), new THREE.MeshStandardMaterial({color: 0xffffff}));
  body.rotation.x = Math.PI / 2;
  const wings = new THREE.Mesh(new THREE.BoxGeometry(9, 0.2, 2), new THREE.MeshStandardMaterial({color: 0xff3333}));
  plane.add(body, wings);
  plane.position.set(0, 120, 0);
  scene.add(plane);
  
  statusPlaneEl.innerText = "⚠ Blockiert! (Nutze Ersatz-Flieger)";
  statusPlaneEl.className = "error";
}

// ========================================================
// 5. LOGIK- & ANIMATIONSSCHLEIFE
// ========================================================
const keys = {};
document.addEventListener("keydown", function(e) { keys[e.code] = true; });
document.addEventListener("keyup", function(e) { keys[e.code] = false; });

let speed = 1.2; 
const elX = document.getElementById("posX");
const elY = document.getElementById("posY");
const elZ = document.getElementById("posZ");

function animate() {
  requestAnimationFrame(animate);

  if (plane) {
    plane.translateZ(speed);

    if (keys["KeyW"]) plane.rotation.x -= 0.015; 
    if (keys["KeyS"]) plane.rotation.x += 0.015; 
    if (keys["KeyA"]) plane.rotation.z += 0.025; 
    if (keys["KeyD"]) plane.rotation.z -= 0.025; 
    
    if (keys["Space"]) speed = Math.min(speed + 0.02, 5.0); 
    else speed = Math.max(speed - 0.01, 0.5); 

    plane.rotation.y -= plane.rotation.z * 0.04;

    const relativeCameraOffset = new THREE.Vector3(0, CAM_HOEHE, CAM_ABSTAND);
    const cameraOffset = relativeCameraOffset.applyMatrix4(plane.matrixWorld);
    
    camera.position.copy(cameraOffset);
    camera.lookAt(plane.position);

    elX.innerText = plane.position.x.toFixed(1);
    elY.innerText = plane.position.y.toFixed(1);
    elZ.innerText = plane.position.z.toFixed(1);
  }

  renderer.render(scene, camera);
}

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>

</body>
</html>
