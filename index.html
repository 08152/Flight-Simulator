<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3D Flight Sim - Custom Map Version</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
  #hud {
    position: absolute; top: 10px; left: 10px;
    color: white; background: rgba(0,0,0,0.7);
    padding: 15px; z-index: 10; border-radius: 5px;
    pointer-events: none;
  }
  .status-line { margin: 3px 0; font-size: 13px; }
  .loading { color: #ffcc00; }
  .success { color: #00ff00; }
  .error { color: #ff3333; }
</style>

<!-- Unverzichtbar: Lädt die Three.js-Bibliotheken korrekt ohne Absturz -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com",
      "three/addons/": "https://unpkg.com"
    }
  }
</script>
</head>
<body>

<div id="hud">
  <strong>Steuerung:</strong> W/S (Nase) | A/D (Rollen) | Leertaste (Gas)<br>
  <hr style="border:0; border-top:1px solid rgba(255,255,255,0.3); margin:5px 0;">
  
  <div class="status-line">Flugzeug: <span id="statusPlane" class="loading">Lade 1.glb...</span></div>
  <div class="status-line">Weltkarte: <span id="statusMap" class="loading">Lade map.glb...</span></div>
  
  <hr style="border:0; border-top:1px solid rgba(255,255,255,0.3); margin:5px 0;">
  <strong>Flugzeug-Position:</strong><br>
  X: <span id="posX">0.0</span> | Y: <span id="posY">0.0</span> | Z: <span id="posZ">0.0</span><br>
  Nase (Pitch): <span id="rotX">0.0</span>° | Rollen: <span id="rotZ">0.0</span>°
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ==========================================
// KAMERA-PERSPEKTIVE (Vogelperspektive von weit oben)
// ==========================================
const CAM_HOEHE   = 50;  // Wie weit über dem Flugzeug? (Erhöhen für mehr Abstand)
const CAM_ABSTAND = -35; // Wie weit hinter dem Flugzeug? (Negativ = dahinter)
const CAM_SEITE   = 0;   // Seitlicher Versatz

// 1. SZENE, KAMERA & RENDERER SETUP
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x53b4ff); // Blauer Himmel
scene.fog = new THREE.FogExp2(0x53b4ff, 0.002); // Sehr leichter Nebel für extreme Weitsicht

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Starke Beleuchtung für die geladenen GLB-Modelle
const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(100, 300, 100);
scene.add(dirLight);

const loader = new GLTFLoader();

// ==========================================
// 2. MAP LOADER (Lädt deine map.glb)
// ==========================================
let customMap = null;

loader.load(
  './map.glb',
  function (gltf) {
    customMap = gltf.scene;
    
    // Falls deine map.glb im Spiel zu klein/groß ist, passe diese Skalierung an:
    customMap.scale.set(1, 1, 1); 
    customMap.position.set(0, 0, 0); // Liegt im Zentrum der Welt
    
    scene.add(customMap);
    
    const statusMapEl = document.getElementById("statusMap");
    statusMapEl.innerText = "✔ map.glb geladen!";
    statusMapEl.className = "success";
  },
  undefined,
  function (error) {
    console.error("Fehler beim Laden der Map:", error);
    const statusMapEl = document.getElementById("statusMap");
    statusMapEl.innerText = "⚠ map.glb fehlt im Ordner!";
    statusMapEl.className = "error";
  }
);

// ==========================================
// 3. PLANE LOADER (Lädt dein Flugzeug 1.glb)
// ==========================================
let plane = null; 

loader.load(
  './1.glb', 
  function (gltf) {
    plane = gltf.scene;
    
    // Falls das Flugzeug zu klein/groß ist, skaliere es hier:
    plane.scale.set(1, 1, 1); 
    plane.position.set(0, 100, 0); // Startet weit oben in der Luft, um deine Map zu überblicken
    scene.add(plane);
    
    // Automatische Zentrierung des Drehpunkts
    const box = new THREE.Box3().setFromObject(plane);
    const center = box.getCenter(new THREE.Vector3());
    plane.children.position.x -= center.x;
    plane.children.position.z -= center.z;
    
    const statusPlaneEl = document.getElementById("statusPlane");
    statusPlaneEl.innerText = "✔ 1.glb geladen!";
    statusPlaneEl.className = "success";
  },
  undefined,
  function (error) {
    console.error("Fehler beim Laden des Flugzeugs:", error);
    const statusPlaneEl = document.getElementById("statusPlane");
    statusPlaneEl.innerText = "⚠ 1.glb fehlt im Ordner!";
    statusPlaneEl.className = "error";
  }
);

// 4. TASTATUR ABFRAGE
const keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

let speed = 0.6; // Startgeschwindigkeit in der Luft

// HUD Text-Elemente cachen
const elX = document.getElementById("posX");
const elY = document.getElementById("posY");
const elZ = document.getElementById("posZ");
const elRotX = document.getElementById("rotX");
const elRotZ = document.getElementById("rotZ");

// 5. ANIMATIONSLOOP
function animate() {
  requestAnimationFrame(animate);

  // Steuerung greift erst, wenn das Flugzeug fertig geladen wurde
  if (plane) {
    // Vorwärtsbewegung entlang der Flugzeug-Achse
    plane.translateZ(speed);

    // Eingaben verarbeiten
    if (keys["KeyW"]) plane.rotation.x -= 0.015; // Nase runter
    if (keys["KeyS"]) plane.rotation.x += 0.015; // Nase hoch
    if (keys["KeyA"]) plane.rotation.z += 0.025; // Links rollen
    if (keys["KeyD"]) plane.rotation.z -= 0.025; // Rechts rollen
    
    if (keys["Space"]) {
      speed = Math.min(speed + 0.01, 3.0); // Gas geben
    } else {
      speed = Math.max(speed - 0.005, 0.4); // Gleitflug-Mindesttempo
    }

    // Realistische Kurve fliegen bei Schräglage (Rollen)
    plane.rotation.y -= plane.rotation.z * 0.05;

    // Dynamische Kamera von weit oben berechnen
    const relativeCameraOffset = new THREE.Vector3(CAM_SEITE, CAM_HOEHE, CAM_ABSTAND);
    const cameraOffset = relativeCameraOffset.applyMatrix4(plane.matrixWorld);
    
    camera.position.x = cameraOffset.x;
    camera.position.y = cameraOffset.y;
    camera.position.z = cameraOffset.z;
    camera.lookAt(plane.position);

    // Live-Flugdaten ins HUD einspeisen
    elX.innerText = plane.position.x.toFixed(1);
    elY.innerText = plane.position.y.toFixed(1);
    elZ.innerText = plane.position.z.toFixed(1);
    elRotX.innerText = (plane.rotation.x * (180 / Math.PI)).toFixed(0);
    elRotZ.innerText = (plane.rotation.z * (180 / Math.PI)).toFixed(0);
  }

  renderer.render(scene, camera);
}

// Fenster-Resizing
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>

</body>
</html>
