<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3D Flight Sim - GitHub Version</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
  #hud {
    position: absolute; top: 10px; left: 10px;
    color: white; background: rgba(0,0,0,0.7);
    padding: 15px; z-index: 10; border-radius: 5px;
    pointer-events: none;
  }
  .loading { color: #ffcc00; }
  .success { color: #00ff00; }
  .error { color: #ff3333; }
</style>

<!-- Import-Map für modernen, sauberen Three.js Import -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com",
      "three/addons/": "https://unpkg.com"
    }
  }
</script>
</head>
<body>

<div id="hud">
  <strong>Steuerung:</strong> W/S (Nase) | A/D (Rollen) | Leertaste (Gas)<br>
  <span id="status" class="loading">Lade Flugzeug (1.glb)...</span>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// 1. SZENE, KAMERA & RENDERER SETUP
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x53b4ff); // Blauer Himmel
scene.fog = new THREE.FogExp2(0x53b4ff, 0.015); // Nebel

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Beleuchtung (Wichtig, damit das GLB-Modell nicht schwarz ist!)
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(20, 40, 20);
scene.add(dirLight);

// 2. BODEN (Graslandschaft mit Raster)
const groundGeo = new THREE.PlaneGeometry(2000, 2000);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e6b1e, roughness: 0.8 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -10;
scene.add(ground);

const grid = new THREE.GridHelper(2000, 100, 0x000000, 0x144414);
grid.position.y = -9.9;
scene.add(grid);

// 3. GLB LOADER (Flugzeug laden)
let plane = null; // Platzhalter für das geladene Modell
const loader = new GLTFLoader();

loader.load(
  './1.glb', // Pfad zu deiner Datei im GitHub-Ordner
  function (gltf) {
    plane = gltf.scene;
    
    // Modell auf eine normale Größe skalieren (falls es im Editor zu groß/klein war)
    plane.scale.set(1, 1, 1); 
    plane.position.set(0, 5, 0);
    
    scene.add(plane);
    
    const statusEl = document.getElementById("status");
    statusEl.innerText = "✔ 1.glb erfolgreich geladen!";
    statusEl.className = "success";
  },
  function (xhr) {
    // Fortschritt (optional)
    if (xhr.total > 0) {
      const percent = Math.round((xhr.loaded / xhr.total) * 100);
      document.getElementById("status").innerText = `Lade: ${percent}%`;
    }
  },
  function (error) {
    console.error("Fehler beim Laden des GLB:", error);
    const statusEl = document.getElementById("status");
    statusEl.innerText = "⚠ Fehler: 1.glb im Ordner nicht gefunden!";
    statusEl.className = "error";
  }
);

// 4. TASTATUR ABFRAGE
const keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

let speed = 0.5;

// 5. ANIMATIONSLOOP
function animate() {
  requestAnimationFrame(animate);

  // Bewegung und Steuerung nur ausführen, wenn das GLB fertig geladen ist!
  if (plane) {
    // Vorwärts in Blickrichtung fliegen
    plane.translateZ(speed);

    // Steuerungseingaben verarbeiten
    if (keys["KeyW"]) plane.rotation.x -= 0.02; // Nase runter
    if (keys["KeyS"]) plane.rotation.x += 0.02; // Nase hoch
    if (keys["KeyA"]) plane.rotation.z += 0.03; // Links rollen
    if (keys["KeyD"]) plane.rotation.z -= 0.03; // Rechts rollen
    
    if (keys["Space"]) {
      speed = Math.min(speed + 0.02, 1.5); // Gas geben
    } else {
      speed = Math.max(speed - 0.01, 0.3); // Mindestgeschwindigkeit
    }

    // Kamera hinter dem Flugzeug herziehen
    const relativeCameraOffset = new THREE.Vector3(0, 2, -8); // 2 Einheiten hoch, 8 zurück
    const cameraOffset = relativeCameraOffset.applyMatrix4(plane.matrixWorld);
    
    camera.position.x = cameraOffset.x;
    camera.position.y = cameraOffset.y;
    camera.position.z = cameraOffset.z;
    camera.lookAt(plane.position);

    // Kollision mit dem Boden verhindern
    if (plane.position.y < -8) {
      plane.position.y = -8;
      plane.rotation.x = 0;
    }
  }

  renderer.render(scene, camera);
}

// Fenstergröße anpassen
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>

</body>
</html>
